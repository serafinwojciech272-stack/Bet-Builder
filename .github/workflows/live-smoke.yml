name: Live Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Frontend HTTP smoke
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 https://bet-builder-live.onrender.com/ -o /tmp/frontend.html
          grep -qi '<html' /tmp/frontend.html

      - name: API health smoke
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 20 https://bet-builder-api-live.onrender.com/health)"
          echo "$body"
          node -e 'const b=JSON.parse(process.argv[1]); if(b.ok!==true || b.service!=="bet-builder-api") process.exit(1)' "$body"

      - name: Live odds smoke
        run: |
          set -euo pipefail
          date="$(date -u +%F)"
          status="$(curl --silent --show-error --max-time 30 -o /tmp/odds.json -w '%{http_code}' "https://bet-builder-api-live.onrender.com/api/odds?date=$date&sport=all")"
          cat /tmp/odds.json
          test "$status" = "200"
          node -e 'const b=require("/tmp/odds.json"); if(b.provider!=="parlay-api" || b.mode!=="LIVE" || !Array.isArray(b.events) || !Array.isArray(b.snapshots) || !b.providerHealth) process.exit(1); console.log(JSON.stringify({events:b.events.length,snapshots:b.snapshots.length,sports:b.sportsQueried.length,state:b.providerHealth.state}))'

      - name: Research smoke
        run: |
          set -euo pipefail
          url='https://bet-builder-api-live.onrender.com/api/research?eventId=live-smoke&home=Manchester%20City&away=Liverpool&sport=soccer&league=Premier%20League'
          status="$(curl --silent --show-error --max-time 30 -o /tmp/research.json -w '%{http_code}' "$url")"
          cat /tmp/research.json
          test "$status" = "200"
          node -e 'const b=require("/tmp/research.json"); if(!b.researchId || !Array.isArray(b.queries) || !Array.isArray(b.sources) || !Array.isArray(b.findings) || !b.consensus) process.exit(1); console.log(JSON.stringify({queries:b.queries.length,sources:b.sources.length,findings:b.findings.length,quality:b.researchQuality}))'

      - name: Result
        run: echo "LIVE SMOKE PASS — frontend + health + live odds + research"
