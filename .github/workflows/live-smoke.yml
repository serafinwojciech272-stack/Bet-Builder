name: Live Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Frontend HTTP smoke
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 https://bet-builder-live.onrender.com/ -o /tmp/frontend.html
          grep -qi '<html' /tmp/frontend.html

      - name: API health smoke
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 20 https://bet-builder-api-live.onrender.com/health)"
          echo "$body"
          node -e 'const b=JSON.parse(process.argv[1]); if(b.ok!==true || b.service!=="bet-builder-api") process.exit(1)' "$body"

      - name: Live odds smoke
        run: |
          set -euo pipefail
          date="$(date -u +%F)"
          status="$(curl --silent --show-error --max-time 30 -o /tmp/odds.json -w '%{http_code}' "https://bet-builder-api-live.onrender.com/api/odds?date=$date&sport=all")"
          cat /tmp/odds.json
          test "$status" = "200"
          node -e 'const b=require("/tmp/odds.json"); if(b.provider!=="parlay-api" || b.mode!=="LIVE" || !Array.isArray(b.events) || !Array.isArray(b.snapshots) || !b.providerHealth) process.exit(1); console.log(JSON.stringify({events:b.events.length,snapshots:b.snapshots.length,sports:b.sportsQueried.length,state:b.providerHealth.state}))'

      - name: Research smoke
        run: |
          set -euo pipefail
          url='https://bet-builder-api-live.onrender.com/api/research?eventId=live-smoke&home=Manchester%20City&away=Liverpool&sport=soccer&league=Premier%20League'
          status="$(curl --silent --show-error --max-time 30 -o /tmp/research.json -w '%{http_code}' "$url")"
          cat /tmp/research.json
          test "$status" = "200"
          node -e 'const b=require("/tmp/research.json"); if(!b.researchId || !Array.isArray(b.queries) || !Array.isArray(b.sources) || !Array.isArray(b.findings) || !b.consensus) process.exit(1); console.log(JSON.stringify({queries:b.queries.length,sources:b.sources.length,findings:b.findings.length,quality:b.researchQuality}))'


      - name: Browser E2E smoke
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:1100}});
          const base = 'https://bet-builder-live.onrender.com';
          const fail = (m) => { throw new Error(m); };
          await page.goto(base + '/?smoke=99593a67135c0eb2dd4416831b4ce5b458a4e109#/events', {waitUntil:'networkidle', timeout:60000});
          await page.getByText('Wydarzenia sportowe').waitFor({timeout:20000});
          if (!(await page.getByText('LIVE ENGINE').count())) fail('LIVE ENGINE badge missing');
          const sportSelect = page.locator('select').filter({hasText:'Wszystkie dyscypliny'}).first();
          await sportSelect.waitFor({timeout:10000});
          const sportOptions = await sportSelect.locator('option').allTextContents();
          if (sportOptions.length < 4 || !sportOptions.includes('Piłka nożna')) fail('Expected provider sport catalog in UI: ' + sportOptions.join(' | '));
          const analyzeLinks = page.getByRole('link', {name:'Analyze event →'});
          if (!(await analyzeLinks.count())) fail('No live event analysis links rendered');
          const analysisHref = await analyzeLinks.first().getAttribute('href');
          if (!analysisHref || !analysisHref.includes('/analysis/')) fail('Analysis route link missing');
          await page.goto(base + '/?smoke=99593a67135c0eb2dd4416831b4ce5b458a4e109#/builder', {waitUntil:'networkidle', timeout:60000});
          await page.getByRole('complementary').getByText('Kupon jest pusty').first().waitFor({timeout:20000});
          const eventButtons = page.locator('section[aria-label="Events"] button[aria-pressed="false"]');
          if (!(await eventButtons.count())) fail('No builder market selections rendered');
          const firstSelection = eventButtons.first();
          await firstSelection.scrollIntoViewIfNeeded();
          await firstSelection.click();
          await page.waitForTimeout(1500);
          const selectedState = await page.locator('section[aria-label="Events"] button').evaluateAll(btns => btns.slice(0,8).map(b => ({text:b.textContent?.trim(), pressed:b.getAttribute('aria-pressed')})));
          console.log('SELECTION STATE', JSON.stringify(selectedState));
          if (!selectedState.some(x => x.pressed === 'true')) fail('Selection did not enter builder state: ' + JSON.stringify(selectedState));
          await page.getByRole('button', {name:'Deep Analyze'}).click();
          await page.getByRole('status').last().waitFor({timeout:60000});
          await page.waitForFunction(() => {
            const el = document.querySelector('[role="status"]');
            const text = el?.textContent || '';
            return text.includes('ANALYZE ALL 1/1') || text.includes('ANALYZE ALL failed');
          }, {timeout:60000});
          const pipelineStatus = await page.getByRole('status').last().innerText();
          if (!pipelineStatus.includes('ANALYZE ALL 1/1') || !pipelineStatus.includes('DEEP RESEARCH ALL 1/1') || !pipelineStatus.includes('EVIDENCE GRAPH 1/1')) {
            const errors = await page.locator('[aria-live="polite"] p').allInnerTexts().catch(() => []);
            fail('Full analysis pipeline incomplete: ' + pipelineStatus + ' | toasts: ' + errors.join(' || '));
          }
          await page.getByRole('button', {name:'Pokaż szczegóły AI, ryzyka i Decision Center'}).click();
          await page.getByRole('heading', {name:'Portfolio Decision Packet'}).first().waitFor({timeout:10000});
          await page.getByRole('button', {name:'Optimize', exact:true}).click();
          await page.waitForTimeout(1500);
          const optimizeStatus = await page.getByRole('status').last().innerText().catch(() => 'NO_STATUS');
          if (!optimizeStatus.includes('Core Optimizer:')) fail('Optimize did not complete: ' + optimizeStatus);
          await page.getByRole('button', {name:'Przekaż do Approval Gate', exact:true}).click();
          await page.waitForURL('**/#/missions/**', {timeout:20000});
          await page.getByRole('heading', {name:'Approval gate'}).waitFor({timeout:20000});
          await page.getByRole('button', {name:'Submit for approval', exact:true}).click();
          await page.getByRole('button', {name:'Approve', exact:true}).waitFor({timeout:10000});
          const requiredChecks = page.locator('input[type="checkbox"]:not(:checked)');
          const checkCount = await requiredChecks.count();
          for (let i = 0; i < checkCount; i++) {
            const checkbox = page.locator('input[type="checkbox"]:not(:checked)').first();
            await checkbox.check();
          }
          await page.getByRole('button', {name:'Approve', exact:true}).click();
          await page.getByText('APPROVED', {exact:true}).first().waitFor({timeout:15000});
          console.log('FULL DECISION FLOW PASS — REAL EVENT → ANALYZE ALL → RESEARCH ALL → EVIDENCE ALL → DECISION → OPTIMIZE → SAVE → APPROVAL GATE → APPROVE → MISSION');
          await browser.close();
          NODE

      - name: Result
        run: echo "LIVE SMOKE PASS — frontend + health + live odds + research"
